
<!DOCTYPE html>
<html>
<head>
    <title>Security Awareness Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1f3c88, #39a2db);
            color: white;
            text-align: center;
            margin-top: 80px;
        }
        .container {
            background: rgba(0,0,0,0.4);
            padding: 50px;
            border-radius: 10px;
            display: inline-block;
            max-width: 500px;
        }
        h1 {
            margin-bottom: 20px;
        }
        .result {
            font-size: 20px;
            margin: 20px 0;
        }
        .tip {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 You didn't pass Security Awareness Test</h1>

        <p class="result">
            ✅ QR code successfully scanned<br><br>
            ⚠️ You engaged with an unverified source
        </p>

        <p>
            Już zapomnialeś o Korpo zasadach 😄
        </p>

        <p>
            <b>Takeaway:</b><br>
            Always verify links and QR codes before interacting.
        </p>

        <div class="tip">
            No data was collected.<br>
            Reward: Scan second code :) 
        </div>
    </div>
</body>
</html>
